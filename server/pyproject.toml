[project]
name = "server"
version = "0.1.0"
description = "AI Form Understanding Assistant Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "google-genai>=2.29.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
]
